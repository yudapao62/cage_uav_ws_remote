fish_farm:
  # Coordinates are ENU metres relative to the existing SITL home/map origin.
  # The farm is centered around the current GPS_A/GPS_B operation area.
  rows: 6
  cols: 10
  cell_size:
    x: 12.0
    y: 12.0
  origin_x: 70.0
  origin_y: -6.0
  yaw_deg: 0.0

  # The topology remains a 6x10 row/column lattice.  Only the shared vertex
  # geometry is deformed; all neighboring cells continue to share exact edges.
  lattice_geometry_mode: deformed
  deformation:
    enabled: true
    preset: medium
    random_seed: 42
    presets:
      mild:
        row_spacing_cv: 0.02
        col_spacing_cv: 0.02
        smooth_warp_amplitude_m: 0.35
        warp_correlation_cells: 3.5
        bend_amplitude_m: 0.25
        shear_deg: 1.0
        local_residual_std_m: 0.04
      medium:
        row_spacing_cv: 0.04
        col_spacing_cv: 0.04
        smooth_warp_amplitude_m: 0.80
        warp_correlation_cells: 3.0
        bend_amplitude_m: 0.60
        shear_deg: 2.0
        local_residual_std_m: 0.08
      strong:
        row_spacing_cv: 0.07
        col_spacing_cv: 0.07
        smooth_warp_amplitude_m: 1.30
        warp_correlation_cells: 2.5
        bend_amplitude_m: 1.00
        shear_deg: 4.0
        local_residual_std_m: 0.12
    validation:
      min_edge_length_ratio: 0.70
      max_edge_length_ratio: 1.30
      min_cell_area_ratio: 0.55
      min_internal_angle_deg: 35.0

  # Physical topology gaps are disabled for P0/P1.  Visual misses and
  # occlusions are injected independently by the observation adapter.
  structural_holes: []
  visual_occluders: []

  beam:
    width: 0.25
    height: 0.20
    z: 0.45

  floats:
    enabled: true
    spacing: 4.0
    radius: 0.30
    length: 0.90
    blue_ratio: 0.70

  net:
    enabled: true
    rows: [1, 3, 5]
    width: 1.20
    z: 0.62
    height_jitter: 0.08
    lateral_jitter: 0.20

  realism:
    random_seed: 42
    float_missing_probability: 0.03
