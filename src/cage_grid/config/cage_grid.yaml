cage:
  # Geometry/task strategy: rectangular | circular. Unknown values fail startup.
  geometry_mode:  circular
  circular:
    feeding_dwell_sec: 5.0
    target_acceptance_radius_m: 1.5
    feeding_altitude_tolerance_m: 3.0

cage_grid:
  cage_id: 0
  rows: 6
  cols: 10
  origin_x: 70.0
  origin_y: -6.0
  origin_z: 0.0
  cell_size_x: 12.0
  cell_size_y: 12.0
  yaw_deg: 0.0
  reference_lat: -35.363261
  reference_lon: 149.165230
  reference_alt: 584.0
  show_cell_id: true
  show_cell_center: true
